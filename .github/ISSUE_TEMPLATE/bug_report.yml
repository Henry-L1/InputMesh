name: Bug report
description: Report a reproducible InputMesh problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting in the Security tab.
  - type: input
    id: version
    attributes:
      label: InputMesh version
      placeholder: 0.1.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Windows and macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove device names, IP addresses, keys and other private data first.
      render: shell
